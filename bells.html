<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Розклад дзвінків — ЗАФК</title>
<meta name="theme-color" content="#16233F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16233F; --navy-deep:#0F1A30; --sky:#3E7CB1; --amber:#E2A63B;
    --bg:#F3F5F8; --card:#FFFFFF; --text:#20293B; --muted:#6B7686; --line:#E4E8EE;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  body{padding-bottom:40px;}

  header{
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:#fff; padding:16px 20px 18px; position:sticky; top:0; z-index:10;
  }
  .top-row{display:flex; align-items:center; gap:10px;}
  .back{color:#C7D3E5; text-decoration:none; font-size:20px; line-height:1; padding:4px 2px;}
  .top-row h1{font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:600; margin:0;}

  main{padding:20px 16px 8px; max-width:520px; margin:0 auto;}

  .list{background:var(--card); border-radius:16px; overflow:hidden; box-shadow:0 1px 2px rgba(20,30,50,0.05);}
  .row{display:flex; align-items:center; gap:14px; padding:14px 16px; border-bottom:1px solid var(--line);}
  .list .row:last-child{border-bottom:none;}
  .pair-badge{
    min-width:40px; height:40px; border-radius:10px; background:#EAF1F8; color:var(--sky);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;
    font-family:'Space Grotesk',sans-serif;
  }
  .row-main{flex:1;}
  .row-main .label{font-size:12px; color:var(--muted);}
  .row-main .time{font-size:16px; font-weight:600; margin-top:1px;}
</style>
</head>
<body>

<header>
  <div class="top-row">
    <a class="back" href="index.html" aria-label="Назад">←</a>
    <h1>Розклад дзвінків</h1>
  </div>
</header>

<main>
  <div class="list">
    <div class="row"><div class="pair-badge">I</div><div class="row-main"><div class="label">1 пара</div><div class="time">9:00 – 10:20</div></div></div>
    <div class="row"><div class="pair-badge">II</div><div class="row-main"><div class="label">2 пара</div><div class="time">10:40 – 12:00</div></div></div>
    <div class="row"><div class="pair-badge">III</div><div class="row-main"><div class="label">3 пара</div><div class="time">12:30 – 13:50</div></div></div>
    <div class="row"><div class="pair-badge">IV</div><div class="row-main"><div class="label">4 пара</div><div class="time">14:10 – 15:30</div></div></div>
    <div class="row"><div class="pair-badge">V</div><div class="row-main"><div class="label">5 пара</div><div class="time">15:40 – 17:00</div></div></div>
    <div class="row"><div class="pair-badge">VI</div><div class="row-main"><div class="label">6 пара</div><div class="time">17:10 – 18:30</div></div></div>
    <div class="row"><div class="pair-badge">VII</div><div class="row-main"><div class="label">7 пара</div><div class="time">18:40 – 20:00</div></div></div>
  </div>
</main>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>

</body>
</html>
