<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Розклад — ЗАФК</title>
<meta name="theme-color" content="#16233F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<style>
  :root{
    --navy:#16233F; --navy-deep:#0F1A30; --sky:#3E7CB1; --amber:#E2A63B;
    --bg:#F3F5F8; --card:#FFFFFF; --text:#20293B; --muted:#6B7686; --line:#E4E8EE;
    --input-bg:#FAFBFC; --ico-bg:#EAF1F8;
    --warn-bg:#FFF1EE; --warn-line:#F5C9C0; --warn-text:#8A3A2B;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0E141F; --card:#1A2233; --text:#E8ECF4; --muted:#8B96AC; --line:#2A3346;
      --input-bg:#212B40; --ico-bg:#22304A;
      --warn-bg:#3A2420; --warn-line:#5A3A33; --warn-text:#FFB4A6;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  body{padding-bottom:40px;}

  header{
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:#fff; padding:16px 20px 18px; position:sticky; top:0; z-index:10;
  }
  .top-row{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .back{color:#C7D3E5; text-decoration:none; font-size:20px; line-height:1; padding:4px 2px;}
  .top-row h1{font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:600; margin:0;}

  .tabs{display:flex; gap:6px; background:rgba(255,255,255,0.08); border-radius:12px; padding:4px;}
  .tab{flex:1; text-align:center; padding:11px 0; border-radius:9px; font-family:'Space Grotesk',sans-serif;
    font-size:14px; font-weight:600; color:#C7D3E5; cursor:pointer; border:none; outline:none; box-shadow:none;
    background:none; -webkit-appearance:none; appearance:none;}
  .tab.active{background:var(--amber); color:var(--navy-deep);}

  main{padding:20px 16px 8px; max-width:520px; margin:0 auto;}

  .picker{background:var(--card); border-radius:16px; padding:14px; margin-bottom:18px; box-shadow:0 1px 2px rgba(20,30,50,0.05);}
  .picker label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; font-weight:500;}
  select, input[type="text"]{
    width:100%; padding:12px 12px; border-radius:10px; border:1px solid var(--line);
    font-size:15px; font-family:'Inter',sans-serif; background:var(--input-bg); color:var(--text);
  }
  select:focus, input:focus{outline:2px solid var(--sky); outline-offset:1px;}

  .status{font-size:13px; color:var(--muted); text-align:center; padding:18px 10px;}
  .status.error{color:#B5432E;}

  .day-group{margin-bottom:20px;}
  .day-group h2{font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:600; color:var(--muted); margin:0 0 8px 4px;}
  .list{background:var(--card); border-radius:16px; overflow:hidden; box-shadow:0 1px 2px rgba(20,30,50,0.05);}
  .row{display:flex; gap:12px; padding:12px 14px; border-bottom:1px solid var(--line);}
  .list .row:last-child{border-bottom:none;}
  .pair-num{
    min-width:30px; height:30px; border-radius:8px; background:var(--ico-bg); color:var(--sky);
    display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; flex-shrink:0;
  }
  .row-text{font-size:14.5px; line-height:1.45;}
  .row-text .group-tag{display:block; font-size:12px; color:var(--sky); font-weight:600; margin-bottom:2px;}
  .row-text .subject{font-weight:500;}
  .row-text .teacher{color:var(--muted); font-size:13px; margin-top:1px;}
  .row-text .extra{color:var(--muted); font-size:12.5px; margin-top:2px; font-style:italic;}
  .week-block{margin-top:6px; padding-top:6px; border-top:1px dashed var(--line);}
  .week-block:first-of-type{margin-top:4px; padding-top:0; border-top:none;}
  .week-tag{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.02em; padding:1px 7px;
    border-radius:6px; margin-bottom:2px;}
  .week-tag.num{background:#DCEEFB; color:#1B6FA8;}
  .week-tag.denom{background:#FBF3D2; color:#8A6D12;}
  .week-block.other-week{opacity:0.55;}
  .current-mark{color:var(--sky); font-weight:800;}

  .subs-banner{
    background:var(--warn-bg); border:1px solid var(--warn-line); color:var(--warn-text);
    border-radius:14px; padding:12px 14px; margin-bottom:16px; font-size:13.5px; line-height:1.5;
  }
  .subs-title{font-family:'Space Grotesk',sans-serif; font-weight:700; margin-bottom:4px;}
  .subs-row b{font-weight:600;}
  .stamp{font-size:12px; color:var(--muted); text-align:center; margin:8px 0 0;}
  .note{
    font-size:12px; color:var(--muted); text-align:center; margin:18px auto 0;
    max-width:460px; line-height:1.5; padding:0 16px;
  }
  .note a{color:var(--sky); text-decoration:none;}
</style>
</head>
<body>

<header>
  <div class="top-row">
    <a class="back" href="index.html" aria-label="Назад">←</a>
    <h1>Розклад занять</h1>
  </div>
  <div class="tabs">
    <button class="tab" id="tab-student" onclick="setMode('student')">За групою</button>
    <button class="tab" id="tab-teacher" onclick="setMode('teacher')">За викладачем</button>
  </div>
</header>

<main>

  <div class="picker" id="student-picker" style="display:none;">
    <label for="groupSelect">Група</label>
    <select id="groupSelect"><option>Завантаження…</option></select>
  </div>

  <div class="picker" id="teacher-picker" style="display:none;">
    <label for="teacherInput">Прізвище викладача</label>
    <input type="text" id="teacherInput" list="teacherList" placeholder="напр. Мітін" autocomplete="off">
    <datalist id="teacherList"></datalist>
  </div>

  <div id="results"></div>

  <p class="stamp" id="stamp"></p>

  <p class="note">
    Дані підтягуються напряму з <a href="https://docs.google.com/spreadsheets/d/19_wG64eTHtf2GdlMRrwzRN9Ki9fk9gVlbZCdo8QkZtw/edit?gid=1411063760" target="_blank" rel="noopener">оригінальної таблиці розкладу</a> через сервіс, який коректно розпізнає предмет і викладача в кожній комірці.
  </p>

</main>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbySrl-VB-L_2yE_Q0EOj317yJGDIV2AD49tVa1WE_lO5KSGWGiqMYADmPRKkG0Ks72s/exec';

// Academic year always starts on a "чисельник" (numerator) week, beginning
// September 1st. Weeks alternate from there.
function mondayOf(d){
  const dow = d.getDay();
  const diff = dow === 0 ? 6 : dow - 1;
  const m = new Date(d);
  m.setDate(d.getDate() - diff);
  m.setHours(0,0,0,0);
  return m;
}
function academicYearStartMonday(d){
  const year = d.getMonth() >= 8 ? d.getFullYear() : d.getFullYear() - 1;
  return mondayOf(new Date(year, 8, 1));
}
function getCurrentWeekParity(){
  const now = new Date();
  const ref = academicYearStartMonday(now);
  const thisMonday = mondayOf(now);
  const weeksSince = Math.round((thisMonday - ref) / (7*24*60*60*1000));
  return weeksSince % 2 === 0 ? 'numerator' : 'denominator';
}

let scheduleData = null; // {groups: [...], schedule: [...], substitutions: {...}}
let mode = null;
let dataTs = 0;          // when scheduleData was fetched
let refreshing = false;  // background refresh in flight
let offline = false;     // last refresh failed (showing saved data)
let uiReady = false;     // event listeners attached
let knownTeachers = [];

const CACHE_KEY = 'zac-schedule-cache';   // shared with the home page

function pad2(n){ return (n < 10 ? '0' : '') + n; }
function toISODate(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }

function loadCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    if(!raw) return null;
    const obj = JSON.parse(raw);
    if(obj && obj.data && Array.isArray(obj.data.schedule) && Array.isArray(obj.data.groups) && obj.data.groups.length) return obj;
  }catch(e){}
  return null;
}
function saveCache(data){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data: data })); }catch(e){}
}
async function fetchScheduleData(){
  const res = await fetch(API_URL);
  if(!res.ok) throw new Error('http ' + res.status);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  if(!Array.isArray(data.schedule) || !Array.isArray(data.groups) || !data.groups.length) throw new Error('bad data');
  return data;
}

// Saved groups / teachers (the home page shows them as quick-switch chips)
function favsKey(kind){ return kind === 'student' ? 'zac-favs-student' : 'zac-favs-teacher'; }
function activeKey(kind){ return kind === 'student' ? 'zac-schedule-group' : 'zac-schedule-teacher'; }
function getFavs(kind){
  let favs = [];
  try{ favs = JSON.parse(localStorage.getItem(favsKey(kind)) || '[]'); }catch(e){}
  if(!Array.isArray(favs)) favs = [];
  const active = localStorage.getItem(activeKey(kind));
  if(active && !favs.includes(active)) favs.unshift(active);
  return favs;
}
function addFav(kind, value){
  if(!value) return;
  const favs = getFavs(kind);
  if(!favs.includes(value)) favs.push(value);
  while(favs.length > 6) favs.shift();
  try{ localStorage.setItem(favsKey(kind), JSON.stringify(favs)); }catch(e){}
}

function updateStamp(){
  const el = document.getElementById('stamp');
  if(!el) return;
  if(!dataTs){ el.textContent = ''; return; }
  const when = new Date(dataTs);
  const hhmm = pad2(when.getHours()) + ':' + pad2(when.getMinutes());
  if(refreshing) el.textContent = 'Дані від ' + hhmm + ' · оновлюю…';
  else if(offline) el.textContent = 'Без мережі · дані від ' + hhmm;
  else el.textContent = (Date.now() - dataTs) < 60000 ? 'Оновлено щойно' : 'Оновлено о ' + hhmm;
}

// In the substitutions doc "1/2" (half of the group) can arrive as "%" because of the
// font, or as "1/2". Show it as "½" and remember that only part of the group is affected.
function parseSubSubject(raw){
  const m = (raw || '').match(/^\s*(?:½|1\/2|%)\s*(.*)$/);
  if(m) return { text: ('½ ' + m[1]).trim(), partial: true };
  return { text: (raw || '').trim(), partial: false };
}

// Substitutions (заміни) for the selected group, shown above its schedule
function subsBannerFor(group){
  const s = scheduleData && scheduleData.substitutions;
  if(!s || !Array.isArray(s.rows)) return '';
  if(s.date && s.date < toISODate(new Date())) return '';   // already in the past
  const rows = s.rows.filter(r => r.group === group).sort((a,b) => Number(a.pair) - Number(b.pair));
  if(!rows.length) return '';
  const label = s.dateLabel ? s.dateLabel.toLowerCase() : '';
  return `<div class="subs-banner"><div class="subs-title">Заміни${label ? ': ' + escapeHtml(label) : ''}</div>`
    + rows.map(r => `<div class="subs-row">${escapeHtml(r.pair)} пара — <b>${escapeHtml(parseSubSubject(r.subject).text || '—')}</b>${r.room ? ', ауд. ' + escapeHtml(r.room) : ''}</div>`).join('')
    + `</div>`;
}

function setMode(m){
  mode = m;
  document.getElementById('tab-student').classList.toggle('active', m === 'student');
  document.getElementById('tab-teacher').classList.toggle('active', m === 'teacher');
  document.getElementById('student-picker').style.display = m === 'student' ? 'block' : 'none';
  document.getElementById('teacher-picker').style.display = m === 'teacher' ? 'block' : 'none';
  localStorage.setItem('zac-schedule-mode', m);
  refreshResults();
}

function refreshResults(){
  const results = document.getElementById('results');
  if(!scheduleData){ results.innerHTML = `<p class="status">Завантажую розклад…</p>`; return; }
  if(mode === 'student'){
    const groupSelect = document.getElementById('groupSelect');
    if(groupSelect.value){
      renderList(getGroupSchedule(groupSelect.value), {emptyText:'У цієї групи немає занять у знайденому розкладі.'});
      const banner = subsBannerFor(groupSelect.value);
      if(banner) results.insertAdjacentHTML('afterbegin', banner);
    }else results.innerHTML = `<p class="status">Оберіть групу вище.</p>`;
  }else if(mode === 'teacher'){
    const teacherInput = document.getElementById('teacherInput');
    if(teacherInput.value) renderList(searchTeacher(teacherInput.value), {emptyText:'Не знайшов збігів — перевірте написання прізвища.'});
    else results.innerHTML = `<p class="status">Введіть прізвище викладача вище.</p>`;
  }
}

function entryMatchesTeacher(it, q){
  if((it.teacher||'').toLowerCase().includes(q)) return true;
  if((it.teachers||[]).some(t => t.toLowerCase().includes(q))) return true;
  if((it.extra||[]).some(x => x.toLowerCase().includes(q))) return true;
  if(it.numerator){
    if((it.numerator.teacher||'').toLowerCase().includes(q)) return true;
    if((it.numerator.teachers||[]).some(t => t.toLowerCase().includes(q))) return true;
  }
  if(it.denominator){
    if((it.denominator.teacher||'').toLowerCase().includes(q)) return true;
    if((it.denominator.teachers||[]).some(t => t.toLowerCase().includes(q))) return true;
  }
  return false;
}

function getGroupSchedule(groupName){
  return scheduleData.schedule.filter(it => it.group === groupName);
}

function searchTeacher(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  return scheduleData.schedule.filter(it => entryMatchesTeacher(it, q));
}

function collectTeacherNames(){
  const names = new Set();
  function addBlock(block){
    if(!block) return;
    if(block.teacher) names.add(block.teacher);
    (block.teachers||[]).forEach(t => names.add(t));
  }
  for(const it of scheduleData.schedule){
    addBlock(it);
    addBlock(it.numerator);
    addBlock(it.denominator);
  }
  return Array.from(names).sort();
}

function teacherText(block){
  if(!block) return '';
  if(block.teachers && block.teachers.length) return block.teachers.join(', ');
  return block.teacher || '';
}

function renderPairContent(it){
  if(it.numerator || it.denominator){
    const parity = getCurrentWeekParity();
    let html = '';
    if(it.numerator){
      const t = teacherText(it.numerator);
      const isCurrent = parity === 'numerator';
      html += `<div class="week-block${isCurrent ? '' : ' other-week'}"><span class="week-tag num">ЧИСЕЛЬНИК${isCurrent ? ' <span class=\"current-mark\">• зараз</span>' : ''}</span>
        <div class="subject">${escapeHtml(it.numerator.subject||'—')}</div>
        ${t ? `<div class="teacher">${escapeHtml(t)}</div>` : ''}</div>`;
    }
    if(it.denominator){
      const t = teacherText(it.denominator);
      const isCurrent = parity === 'denominator';
      html += `<div class="week-block${isCurrent ? '' : ' other-week'}"><span class="week-tag denom">ЗНАМЕННИК${isCurrent ? ' <span class=\"current-mark\">• зараз</span>' : ''}</span>
        <div class="subject">${escapeHtml(it.denominator.subject||'—')}</div>
        ${t ? `<div class="teacher">${escapeHtml(t)}</div>` : ''}</div>`;
    }
    if(it.subject){
      const t = teacherText(it);
      html += `<div class="week-block"><div class="subject">${escapeHtml(it.subject)}</div>
        ${t ? `<div class="teacher">${escapeHtml(t)}</div>` : ''}</div>`;
    }
    return html;
  }
  const t = teacherText(it);
  const teacherLine = t ? `<div class="teacher">${escapeHtml(t)}</div>` : '';
  const extraLine = (it.extra && it.extra.length) ? `<div class="extra">${it.extra.map(escapeHtml).join(' · ')}</div>` : '';
  return `<div class="subject">${escapeHtml(it.subject||'—')}</div>${teacherLine}${extraLine}`;
}

function renderList(items, opts={}){
  const el = document.getElementById('results');
  if(!items.length){
    el.innerHTML = `<p class="status">${opts.emptyText || 'Нічого не знайдено.'}</p>`;
    return;
  }
  const byDay = {};
  for(const it of items){
    (byDay[it.day] = byDay[it.day] || []).push(it);
  }
  let html = '';
  for(const day of Object.keys(byDay)){
    html += `<div class="day-group"><h2>${day}</h2><div class="list">`;
    for(const it of byDay[day].sort((a,b)=>Number(a.pair)-Number(b.pair))){
      const groupTag = it.group ? `<span class="group-tag">${escapeHtml(it.group)}</span>` : '';
      html += `<div class="row"><div class="pair-num">${escapeHtml(it.pair)}</div><div class="row-text">${groupTag}${renderPairContent(it)}</div></div>`;
    }
    html += `</div></div>`;
  }
  el.innerHTML = html;
}

function escapeHtml(s){
  return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function applyData(data){
  scheduleData = data;
  const groupSelect = document.getElementById('groupSelect');
  const teacherInput = document.getElementById('teacherInput');
  const teacherList = document.getElementById('teacherList');

  // keep what the user has selected when fresh data replaces cached data
  const savedGroup = uiReady ? groupSelect.value : localStorage.getItem('zac-schedule-group');
  groupSelect.innerHTML = data.groups.map(g => `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join('');
  if(savedGroup && data.groups.includes(savedGroup)) groupSelect.value = savedGroup;

  knownTeachers = collectTeacherNames();
  teacherList.innerHTML = knownTeachers.map(n => `<option value="${escapeHtml(n)}">`).join('');

  if(!uiReady){
    const savedTeacher = localStorage.getItem('zac-schedule-teacher');
    if(savedTeacher) teacherInput.value = savedTeacher;
    if(savedGroup && data.groups.includes(savedGroup)) tagOneSignal('group', savedGroup);
    if(savedTeacher && knownTeachers.includes(savedTeacher)) tagOneSignal('teacher', savedTeacher);

    groupSelect.addEventListener('change', () => {
      const v = groupSelect.value;
      addFav('student', v);                       // first: keeps the previously saved group in the list
      localStorage.setItem('zac-schedule-group', v);
      tagOneSignal('group', v);
      refreshResults();
    });

    let debounce;
    teacherInput.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(() => {
        const v = teacherInput.value.trim();
        // only a full, known surname becomes the saved teacher (not half-typed text)
        if(knownTeachers.includes(v)){
          addFav('teacher', v);
          localStorage.setItem('zac-schedule-teacher', v);
          tagOneSignal('teacher', v);
        }
        refreshResults();
      }, 250);
    });
    uiReady = true;
  }
  refreshResults();
}

async function loadSchedule(){
  const results = document.getElementById('results');
  const cached = loadCache();
  if(cached){
    dataTs = cached.ts;
    applyData(cached.data);          // show the last saved schedule at once
  }else{
    results.innerHTML = `<p class="status">Завантажую розклад…</p>`;
  }
  refreshing = true;
  updateStamp();
  try{
    const fresh = await fetchScheduleData();
    dataTs = Date.now();
    offline = false;
    saveCache(fresh);
    refreshing = false;
    applyData(fresh);
  }catch(err){
    refreshing = false;
    offline = true;
    if(!scheduleData) results.innerHTML = `<p class="status error">Не вдалося завантажити розклад. Перевірте інтернет-з'єднання.</p>`;
  }
  updateStamp();
}

// --- OneSignal push notifications ---
window.OneSignalDeferred = window.OneSignalDeferred || [];
window.OneSignalDeferred.push(async function(OneSignal){
  await OneSignal.init({
    appId: 'e969a28b-d25b-4ec8-b2fc-cc0b581e30ba',
    serviceWorkerPath: '/zafc-app/onesignal/OneSignalSDKWorker.js',
    serviceWorkerParam: { scope: '/zafc-app/onesignal/' }
  });
});

function tagOneSignal(kind, value){
  if(!value) return;
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  window.OneSignalDeferred.push(async function(OneSignal){
    try{ await OneSignal.User.addTag(kind, value); }catch(e){}
  });
}

(function init(){
  const params = new URLSearchParams(location.search);
  const savedMode = localStorage.getItem('zac-schedule-mode');
  setMode(params.get('view') || savedMode || 'student');
  loadSchedule();
})();
</script>

</body>
</html>
