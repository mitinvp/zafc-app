<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Розклад — ЗАФК</title>
<meta name="theme-color" content="#16233F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --navy:#16233F; --navy-deep:#0F1A30; --sky:#3E7CB1; --amber:#E2A63B;
    --bg:#F3F5F8; --card:#FFFFFF; --text:#20293B; --muted:#6B7686; --line:#E4E8EE;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  body{padding-bottom:40px;}

  header{
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:#fff; padding:16px 20px 18px; position:sticky; top:0; z-index:10;
  }
  .top-row{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .back{color:#C7D3E5; text-decoration:none; font-size:20px; line-height:1; padding:4px 2px;}
  .top-row h1{font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:600; margin:0;}

  .tabs{display:flex; gap:6px; background:rgba(255,255,255,0.08); border-radius:12px; padding:4px;}
  .tab{flex:1; text-align:center; padding:11px 0; border-radius:9px; font-family:'Space Grotesk',sans-serif;
    font-size:14px; font-weight:600; color:#C7D3E5; cursor:pointer; border:none; background:none;}
  .tab.active{background:var(--amber); color:var(--navy-deep);}

  main{padding:20px 16px 8px; max-width:520px; margin:0 auto;}

  .picker{background:var(--card); border-radius:16px; padding:14px; margin-bottom:18px; box-shadow:0 1px 2px rgba(20,30,50,0.05);}
  .picker label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; font-weight:500;}
  select, input[type="text"]{
    width:100%; padding:12px 12px; border-radius:10px; border:1px solid var(--line);
    font-size:15px; font-family:'Inter',sans-serif; background:#FAFBFC; color:var(--text);
  }
  select:focus, input:focus{outline:2px solid var(--sky); outline-offset:1px;}

  .status{font-size:13px; color:var(--muted); text-align:center; padding:18px 10px;}
  .status.error{color:#B5432E;}

  .day-group{margin-bottom:20px;}
  .day-group h2{font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:600; color:var(--muted); margin:0 0 8px 4px;}
  .list{background:var(--card); border-radius:16px; overflow:hidden; box-shadow:0 1px 2px rgba(20,30,50,0.05);}
  .row{display:flex; gap:12px; padding:12px 14px; border-bottom:1px solid var(--line);}
  .list .row:last-child{border-bottom:none;}
  .pair-num{
    min-width:30px; height:30px; border-radius:8px; background:#EAF1F8; color:var(--sky);
    display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; flex-shrink:0;
  }
  .row-text{font-size:14.5px; line-height:1.45; white-space:pre-line;}
  .row-text .group-tag{display:block; font-size:12px; color:var(--sky); font-weight:600; margin-bottom:2px;}

  .note{
    font-size:12px; color:var(--muted); text-align:center; margin:18px auto 0;
    max-width:460px; line-height:1.5; padding:0 16px;
  }
  .note a{color:var(--sky); text-decoration:none;}
</style>
</head>
<body>

<header>
  <div class="top-row">
    <a class="back" href="index.html" aria-label="Назад">←</a>
    <h1>Розклад занять</h1>
  </div>
  <div class="tabs">
    <button class="tab" id="tab-student" onclick="setMode('student')">За групою</button>
    <button class="tab" id="tab-teacher" onclick="setMode('teacher')">За викладачем</button>
  </div>
</header>

<main>

  <div class="picker" id="student-picker" style="display:none;">
    <label for="groupSelect">Група</label>
    <select id="groupSelect"><option>Завантаження…</option></select>
  </div>

  <div class="picker" id="teacher-picker" style="display:none;">
    <label for="teacherInput">Прізвище викладача</label>
    <input type="text" id="teacherInput" list="teacherList" placeholder="напр. Мітін" autocomplete="off">
    <datalist id="teacherList"></datalist>
  </div>

  <div id="results"></div>

  <p class="note">
    Дані підтягуються напряму з <a href="https://docs.google.com/spreadsheets/d/1Zl0ZLRb8_XtR4yr1GeeBW2_FP1Z2WXnL/edit?gid=596387843" target="_blank" rel="noopener">оригінальної таблиці розкладу</a>.
    Текст показано так, як він записаний у клітинці — якщо є поділ на підгрупи, обидва варіанти йдуть одним блоком.
  </p>

</main>

<script>
const SHEET_ID = '1Zl0ZLRb8_XtR4yr1GeeBW2_FP1Z2WXnL';
const GID = '596387843';
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`;

const DAYS = ['ПОНЕДІЛОК','ВІВТОРОК','СЕРЕДА','ЧЕТВЕР','ПЯТНИЦЯ',"П'ЯТНИЦЯ",'СУБОТА'];

function normalize(s){ return (s||'').replace(/['’ʼ]/g,'').trim().toUpperCase(); }

let parsed = null;
let mode = null;

function setMode(m){
  mode = m;
  document.getElementById('tab-student').classList.toggle('active', m === 'student');
  document.getElementById('tab-teacher').classList.toggle('active', m === 'teacher');
  document.getElementById('student-picker').style.display = m === 'student' ? 'block' : 'none';
  document.getElementById('teacher-picker').style.display = m === 'teacher' ? 'block' : 'none';
  document.getElementById('results').innerHTML = '';
  localStorage.setItem('zac-schedule-mode', m);
}

function parseSchedule(rows){
  const firstDayRowIdx = rows.findIndex(r => DAYS.includes(normalize(r[0])));
  let groupRowIdx = rows.findIndex(r => normalize(r[0]) === 'ГРУПИ');
  if(groupRowIdx < 0 && firstDayRowIdx > 0){
    // Fallback: the header row is the last row before the first day
    // that has many non-empty cells (group names), regardless of label text.
    for(let r = firstDayRowIdx - 1; r >= 0; r--){
      const nonEmpty = rows[r].slice(1).filter(c => (c||'').trim()).length;
      if(nonEmpty >= 5){ groupRowIdx = r; break; }
    }
  }
  const groups = [];
  if(groupRowIdx >= 0){
    const headerRow = rows[groupRowIdx];
    for(let c=1;c<headerRow.length;c++){
      const v = (headerRow[c]||'').trim();
      if(v) groups.push({name:v, col:c});
    }
  }
  const blocks = [];
  let curDay = null, curPairStart = null, curPairNum = null;
  function closeBlock(endRow){
    if(curDay && curPairNum !== null && endRow > curPairStart){
      blocks.push({day:curDay, pair:curPairNum, start:curPairStart, end:endRow});
    }
  }
  const startRow = groupRowIdx >= 0 ? groupRowIdx + 1 : 0;
  for(let r = startRow; r < rows.length; r++){
    const row = rows[r];
    const c0 = normalize(row[0]);
    if(DAYS.includes(c0)){
      closeBlock(r);
      curDay = row[0].trim();
      curPairNum = null; curPairStart = null;
      continue;
    }
    const c1 = (row[1]||'').trim();
    if(/^[0-6]$/.test(c1)){
      closeBlock(r);
      curPairNum = c1;
      curPairStart = r + 1;
    }
  }
  closeBlock(rows.length);
  return {groups, blocks, rows};
}

function getGroupSchedule(groupName){
  const g = parsed.groups.find(x => x.name === groupName);
  if(!g) return [];
  const out = [];
  for(const b of parsed.blocks){
    const lines = [];
    for(let r=b.start; r<b.end; r++){
      const v = (parsed.rows[r][g.col]||'').trim();
      if(v) lines.push(v);
    }
    if(lines.length) out.push({day:b.day, pair:b.pair, text: lines.join('\n')});
  }
  return out;
}

function searchTeacher(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  const out = [];
  for(const b of parsed.blocks){
    for(const g of parsed.groups){
      const lines = [];
      let matched = false;
      for(let r=b.start; r<b.end; r++){
        const v = (parsed.rows[r][g.col]||'').trim();
        if(v){ lines.push(v); if(v.toLowerCase().includes(q)) matched = true; }
      }
      if(matched && lines.length) out.push({day:b.day, pair:b.pair, group:g.name, text: lines.join('\n')});
    }
  }
  return out;
}

function collectTeacherNames(){
  // Heuristic: last non-empty line of a block is usually the teacher surname.
  const names = new Set();
  for(const b of parsed.blocks){
    for(const g of parsed.groups){
      let last = '';
      for(let r=b.start; r<b.end; r++){
        const v = (parsed.rows[r][g.col]||'').trim();
        if(v) last = v;
      }
      if(last && /^[А-ЯІЇЄҐ][а-яіїєґ'’]+(\s[А-ЯІЇЄҐ]\.?){0,2}$/.test(last)){
        names.add(last);
      }
    }
  }
  return Array.from(names).sort();
}

function renderList(items, opts={}){
  const el = document.getElementById('results');
  if(!items.length){
    el.innerHTML = `<p class="status">${opts.emptyText || 'Нічого не знайдено.'}</p>`;
    return;
  }
  const byDay = {};
  for(const it of items){
    (byDay[it.day] = byDay[it.day] || []).push(it);
  }
  let html = '';
  for(const day of Object.keys(byDay)){
    html += `<div class="day-group"><h2>${day}</h2><div class="list">`;
    for(const it of byDay[day].sort((a,b)=>a.pair-b.pair)){
      const groupTag = it.group ? `<span class="group-tag">${it.group}</span>` : '';
      html += `<div class="row"><div class="pair-num">${it.pair}</div><div class="row-text">${groupTag}${escapeHtml(it.text)}</div></div>`;
    }
    html += `</div></div>`;
  }
  el.innerHTML = html;
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function loadSchedule(){
  const results = document.getElementById('results');
  results.innerHTML = `<p class="status">Завантажую розклад…</p>`;
  try{
    const res = await fetch(CSV_URL);
    if(!res.ok) throw new Error('http ' + res.status);
    const csvText = await res.text();
    const rows = Papa.parse(csvText, {skipEmptyLines:false}).data;
    parsed = parseSchedule(rows);
    if(!parsed.groups.length) throw new Error('groups not found');

    const groupSelect = document.getElementById('groupSelect');
    groupSelect.innerHTML = parsed.groups.map(g => `<option value="${g.name}">${g.name}</option>`).join('');
    const savedGroup = localStorage.getItem('zac-schedule-group');
    if(savedGroup && parsed.groups.some(g => g.name === savedGroup)) groupSelect.value = savedGroup;
    groupSelect.addEventListener('change', () => {
      localStorage.setItem('zac-schedule-group', groupSelect.value);
      renderList(getGroupSchedule(groupSelect.value), {emptyText:'У цієї групи немає занять у знайденому розкладі.'});
    });

    const teacherList = document.getElementById('teacherList');
    teacherList.innerHTML = collectTeacherNames().map(n => `<option value="${n}">`).join('');
    const teacherInput = document.getElementById('teacherInput');
    let debounce;
    teacherInput.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(() => {
        localStorage.setItem('zac-schedule-teacher', teacherInput.value);
        renderList(searchTeacher(teacherInput.value), {emptyText:'Не знайшов збігів — перевірте написання прізвища.'});
      }, 250);
    });

    results.innerHTML = `<p class="status">Оберіть ${mode === 'teacher' ? 'викладача' : 'групу'} вище.</p>`;
    if(mode === 'student' && groupSelect.value) renderList(getGroupSchedule(groupSelect.value));
    if(mode === 'teacher'){
      const savedTeacher = localStorage.getItem('zac-schedule-teacher');
      if(savedTeacher){ teacherInput.value = savedTeacher; renderList(searchTeacher(savedTeacher)); }
    }
  }catch(err){
    results.innerHTML = `<p class="status error">Не вдалося завантажити розклад. Перевірте інтернет-з'єднання або доступ до таблиці (має бути "Доступ для всіх, хто має посилання").</p>`;
  }
}

(function init(){
  const params = new URLSearchParams(location.search);
  const savedMode = localStorage.getItem('zac-schedule-mode');
  setMode(params.get('view') || savedMode || 'student');
  loadSchedule();
})();
</script>

</body>
</html>
