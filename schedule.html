<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Розклад — ЗАФК</title>
<meta name="theme-color" content="#16233F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16233F; --navy-deep:#0F1A30; --sky:#3E7CB1; --amber:#E2A63B;
    --bg:#F3F5F8; --card:#FFFFFF; --text:#20293B; --muted:#6B7686; --line:#E4E8EE;
    --input-bg:#FAFBFC; --ico-bg:#EAF1F8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0E141F; --card:#1A2233; --text:#E8ECF4; --muted:#8B96AC; --line:#2A3346;
      --input-bg:#212B40; --ico-bg:#22304A;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  body{padding-bottom:40px;}

  header{
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:#fff; padding:16px 20px 18px; position:sticky; top:0; z-index:10;
  }
  .top-row{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .back{color:#C7D3E5; text-decoration:none; font-size:20px; line-height:1; padding:4px 2px;}
  .top-row h1{font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:600; margin:0;}

  .tabs{display:flex; gap:6px; background:rgba(255,255,255,0.08); border-radius:12px; padding:4px;}
  .tab{flex:1; text-align:center; padding:11px 0; border-radius:9px; font-family:'Space Grotesk',sans-serif;
    font-size:14px; font-weight:600; color:#C7D3E5; cursor:pointer; border:none; outline:none; box-shadow:none;
    background:none; -webkit-appearance:none; appearance:none;}
  .tab.active{background:var(--amber); color:var(--navy-deep);}

  main{padding:20px 16px 8px; max-width:520px; margin:0 auto;}

  .picker{background:var(--card); border-radius:16px; padding:14px; margin-bottom:18px; box-shadow:0 1px 2px rgba(20,30,50,0.05);}
  .picker label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; font-weight:500;}
  select, input[type="text"]{
    width:100%; padding:12px 12px; border-radius:10px; border:1px solid var(--line);
    font-size:15px; font-family:'Inter',sans-serif; background:var(--input-bg); color:var(--text);
  }
  select:focus, input:focus{outline:2px solid var(--sky); outline-offset:1px;}

  .status{font-size:13px; color:var(--muted); text-align:center; padding:18px 10px;}
  .status.error{color:#B5432E;}

  .day-group{margin-bottom:20px;}
  .day-group h2{font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:600; color:var(--muted); margin:0 0 8px 4px;}
  .list{background:var(--card); border-radius:16px; overflow:hidden; box-shadow:0 1px 2px rgba(20,30,50,0.05);}
  .row{display:flex; gap:12px; padding:12px 14px; border-bottom:1px solid var(--line);}
  .list .row:last-child{border-bottom:none;}
  .pair-num{
    min-width:30px; height:30px; border-radius:8px; background:var(--ico-bg); color:var(--sky);
    display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; flex-shrink:0;
  }
  .row-text{font-size:14.5px; line-height:1.45;}
  .row-text .group-tag{display:block; font-size:12px; color:var(--sky); font-weight:600; margin-bottom:2px;}
  .row-text .subject{font-weight:500;}
  .row-text .teacher{color:var(--muted); font-size:13px; margin-top:1px;}
  .row-text .extra{color:var(--muted); font-size:12.5px; margin-top:2px; font-style:italic;}
  .week-block{margin-top:6px; padding-top:6px; border-top:1px dashed var(--line);}
  .week-block:first-of-type{margin-top:4px; padding-top:0; border-top:none;}
  .week-tag{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.02em; padding:1px 7px;
    border-radius:6px; margin-bottom:2px;}
  .week-tag.num{background:#DCEEFB; color:#1B6FA8;}
  .week-tag.denom{background:#FBF3D2; color:#8A6D12;}

  .note{
    font-size:12px; color:var(--muted); text-align:center; margin:18px auto 0;
    max-width:460px; line-height:1.5; padding:0 16px;
  }
  .note a{color:var(--sky); text-decoration:none;}
</style>
</head>
<body>

<header>
  <div class="top-row">
    <a class="back" href="index.html" aria-label="Назад">←</a>
    <h1>Розклад занять</h1>
  </div>
  <div class="tabs">
    <button class="tab" id="tab-student" onclick="setMode('student')">За групою</button>
    <button class="tab" id="tab-teacher" onclick="setMode('teacher')">За викладачем</button>
  </div>
</header>

<main>

  <div class="picker" id="student-picker" style="display:none;">
    <label for="groupSelect">Група</label>
    <select id="groupSelect"><option>Завантаження…</option></select>
  </div>

  <div class="picker" id="teacher-picker" style="display:none;">
    <label for="teacherInput">Прізвище викладача</label>
    <input type="text" id="teacherInput" list="teacherList" placeholder="напр. Мітін" autocomplete="off">
    <datalist id="teacherList"></datalist>
  </div>

  <div id="results"></div>

  <p class="note">
    Дані підтягуються напряму з <a href="https://docs.google.com/spreadsheets/d/1Zl0ZLRb8_XtR4yr1GeeBW2_FP1Z2WXnL/edit?gid=596387843" target="_blank" rel="noopener">оригінальної таблиці розкладу</a> через сервіс, який коректно розпізнає предмет і викладача в кожній комірці.
  </p>

</main>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbySrl-VB-L_2yE_Q0EOj317yJGDIV2AD49tVa1WE_lO5KSGWGiqMYADmPRKkG0Ks72s/exec';

let scheduleData = null; // {groups: [...], schedule: [{day,pair,group,subject,teacher,extra}]}
let mode = null;

function setMode(m){
  mode = m;
  document.getElementById('tab-student').classList.toggle('active', m === 'student');
  document.getElementById('tab-teacher').classList.toggle('active', m === 'teacher');
  document.getElementById('student-picker').style.display = m === 'student' ? 'block' : 'none';
  document.getElementById('teacher-picker').style.display = m === 'teacher' ? 'block' : 'none';
  localStorage.setItem('zac-schedule-mode', m);
  refreshResults();
}

function refreshResults(){
  const results = document.getElementById('results');
  if(!scheduleData){ results.innerHTML = `<p class="status">Завантажую розклад…</p>`; return; }
  if(mode === 'student'){
    const groupSelect = document.getElementById('groupSelect');
    if(groupSelect.value) renderList(getGroupSchedule(groupSelect.value), {emptyText:'У цієї групи немає занять у знайденому розкладі.'});
    else results.innerHTML = `<p class="status">Оберіть групу вище.</p>`;
  }else if(mode === 'teacher'){
    const teacherInput = document.getElementById('teacherInput');
    if(teacherInput.value) renderList(searchTeacher(teacherInput.value), {emptyText:'Не знайшов збігів — перевірте написання прізвища.'});
    else results.innerHTML = `<p class="status">Введіть прізвище викладача вище.</p>`;
  }
}

function entryMatchesTeacher(it, q){
  if((it.teacher||'').toLowerCase().includes(q)) return true;
  if((it.extra||[]).some(x => x.toLowerCase().includes(q))) return true;
  if(it.numerator && (it.numerator.teacher||'').toLowerCase().includes(q)) return true;
  if(it.denominator && (it.denominator.teacher||'').toLowerCase().includes(q)) return true;
  return false;
}

function getGroupSchedule(groupName){
  return scheduleData.schedule.filter(it => it.group === groupName);
}

function searchTeacher(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  return scheduleData.schedule.filter(it => entryMatchesTeacher(it, q));
}

const TEACHER_NAME_RE = /^[А-ЯІЇЄҐ][а-яіїєґ'ʼ]+(-[А-ЯІЇЄҐ][а-яіїєґ'ʼ]+)?(\s[А-ЯІЇЄҐ]\.\s?[А-ЯІЇЄҐ]?\.?)?$/;
const TEACHER_NAME_EXCLUDE = new Set(['вакансія','вакансія.','ваканція']);

function looksLikeTeacherName(s){
  const v = (s||'').trim();
  if(!v) return false;
  if(TEACHER_NAME_EXCLUDE.has(v.toLowerCase())) return false;
  return TEACHER_NAME_RE.test(v);
}

function collectTeacherNames(){
  const names = new Set();
  for(const it of scheduleData.schedule){
    if(looksLikeTeacherName(it.teacher)) names.add(it.teacher);
    if(it.numerator && looksLikeTeacherName(it.numerator.teacher)) names.add(it.numerator.teacher);
    if(it.denominator && looksLikeTeacherName(it.denominator.teacher)) names.add(it.denominator.teacher);
  }
  return Array.from(names).sort();
}

function renderPairContent(it){
  if(it.numerator || it.denominator){
    let html = '';
    if(it.numerator){
      html += `<div class="week-block"><span class="week-tag num">ЧИСЕЛЬНИК</span>
        <div class="subject">${escapeHtml(it.numerator.subject||'—')}</div>
        ${it.numerator.teacher ? `<div class="teacher">${escapeHtml(it.numerator.teacher)}</div>` : ''}</div>`;
    }
    if(it.denominator){
      html += `<div class="week-block"><span class="week-tag denom">ЗНАМЕННИК</span>
        <div class="subject">${escapeHtml(it.denominator.subject||'—')}</div>
        ${it.denominator.teacher ? `<div class="teacher">${escapeHtml(it.denominator.teacher)}</div>` : ''}</div>`;
    }
    if(it.subject){
      html += `<div class="week-block"><div class="subject">${escapeHtml(it.subject)}</div>
        ${it.teacher ? `<div class="teacher">${escapeHtml(it.teacher)}</div>` : ''}</div>`;
    }
    return html;
  }
  const teacherLine = it.teacher ? `<div class="teacher">${escapeHtml(it.teacher)}</div>` : '';
  const extraLine = (it.extra && it.extra.length) ? `<div class="extra">${it.extra.map(escapeHtml).join(' · ')}</div>` : '';
  return `<div class="subject">${escapeHtml(it.subject||'—')}</div>${teacherLine}${extraLine}`;
}

function renderList(items, opts={}){
  const el = document.getElementById('results');
  if(!items.length){
    el.innerHTML = `<p class="status">${opts.emptyText || 'Нічого не знайдено.'}</p>`;
    return;
  }
  const byDay = {};
  for(const it of items){
    (byDay[it.day] = byDay[it.day] || []).push(it);
  }
  let html = '';
  for(const day of Object.keys(byDay)){
    html += `<div class="day-group"><h2>${day}</h2><div class="list">`;
    for(const it of byDay[day].sort((a,b)=>Number(a.pair)-Number(b.pair))){
      const groupTag = it.group ? `<span class="group-tag">${escapeHtml(it.group)}</span>` : '';
      html += `<div class="row"><div class="pair-num">${escapeHtml(it.pair)}</div><div class="row-text">${groupTag}${renderPairContent(it)}</div></div>`;
    }
    html += `</div></div>`;
  }
  el.innerHTML = html;
}

function escapeHtml(s){
  return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function loadSchedule(){
  const results = document.getElementById('results');
  results.innerHTML = `<p class="status">Завантажую розклад…</p>`;
  try{
    const res = await fetch(API_URL);
    if(!res.ok) throw new Error('http ' + res.status);
    scheduleData = await res.json();
    if(scheduleData.error) throw new Error(scheduleData.error);
    if(!scheduleData.groups || !scheduleData.groups.length) throw new Error('groups not found');

    const groupSelect = document.getElementById('groupSelect');
    groupSelect.innerHTML = scheduleData.groups.map(g => `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join('');
    const savedGroup = localStorage.getItem('zac-schedule-group');
    if(savedGroup && scheduleData.groups.includes(savedGroup)) groupSelect.value = savedGroup;
    groupSelect.addEventListener('change', () => {
      localStorage.setItem('zac-schedule-group', groupSelect.value);
      refreshResults();
    });

    const teacherList = document.getElementById('teacherList');
    teacherList.innerHTML = collectTeacherNames().map(n => `<option value="${escapeHtml(n)}">`).join('');
    const teacherInput = document.getElementById('teacherInput');
    const savedTeacher = localStorage.getItem('zac-schedule-teacher');
    if(savedTeacher) teacherInput.value = savedTeacher;
    let debounce;
    teacherInput.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(() => {
        localStorage.setItem('zac-schedule-teacher', teacherInput.value);
        refreshResults();
      }, 250);
    });

    refreshResults();
  }catch(err){
    results.innerHTML = `<p class="status error">Не вдалося завантажити розклад. Перевірте інтернет-з'єднання.</p>`;
  }
}

(function init(){
  const params = new URLSearchParams(location.search);
  const savedMode = localStorage.getItem('zac-schedule-mode');
  setMode(params.get('view') || savedMode || 'student');
  loadSchedule();
})();
</script>

</body>
</html>
